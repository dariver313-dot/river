<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抽奖数据库 · 极简操作</title>
    <!-- 无多余功能：只读 lottery_data.db，可修改单元格，保存回原文件 -->
    <style>
      * {
        box-sizing: border-box;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background: #f2f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
      }
      .pane {
        max-width: 800px;
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02);
        border: 1px solid #d9e2e9;
      }
      h3 {
        margin: 0 0 6px 0;
        font-weight: 500;
        color: #1e3b4c;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .file-badge {
        background: #1e3b4c;
        color: white;
        border-radius: 40px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 400;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0 10px;
        background: white;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      }
      th {
        background: #e9f0f5;
        color: #1d4051;
        font-weight: 600;
        font-size: 0.8rem;
        padding: 12px 10px;
        text-align: left;
        letter-spacing: 0.3px;
      }
      td {
        padding: 10px;
        border-bottom: 1px solid #e4ebf0;
      }
      .cell-editor {
        background: #fffdf5;
        border: 1px solid #f3d88c;
        border-radius: 10px;
        padding: 8px 12px;
        width: 100%;
        outline: none;
        font-size: 0.9rem;
      }
      .actions {
        display: flex;
        gap: 16px;
        margin: 16px 0 8px;
        flex-wrap: wrap;
      }
      button {
        background: white;
        border: 1px solid #b6cfdd;
        border-radius: 40px;
        padding: 10px 24px;
        font-size: 0.9rem;
        color: #17303d;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        background: #fafeff;
      }
      button:hover {
        background: #e0ecf3;
        border-color: #6f94aa;
      }
      .status {
        background: #ecf3f8;
        border-radius: 40px;
        padding: 12px 20px;
        font-size: 0.85rem;
        color: #2e5768;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        border: 1px solid #d3e0e8;
      }
      .footnote {
        color: #5e7987;
        font-size: 0.8rem;
      }
    </style>
    <!-- SQL.js 纯wasm，用于操作本地db文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  </head>
  <body>
    <div class="pane">
      <h3>
        🎯 lottery_data.db
        <span class="file-badge">本地数据库 · 直接读写</span>
      </h3>
      <p
        style="
          color: #3f6575;
          margin: 6px 0 12px;
          font-size: 0.9rem;
          background: #f2f8fc;
          padding: 10px 16px;
          border-radius: 30px;
        "
      >
        📁 点击【选取.db文件】打开您的 lottery_data.db → 修改表格 →
        保存覆盖原文件
      </p>

      <!-- 表格区：动态显示数据库内容 -->
      <div style="overflow-x: auto">
        <table id="data-table">
          <thead id="table-header">
            <tr>
              <th colspan="10" style="text-align: center">
                ⬇️ 请先选择 lottery_data.db 文件
              </th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr>
              <td
                colspan="10"
                style="text-align: center; padding: 30px; color: #678494"
              >
                ⏳ 未加载任何数据库
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 极简操作区：只有【选取文件】【保存覆盖原文件】两个核心按钮 -->
      <div class="actions">
        <button id="openFileBtn">📂 1. 选取 lottery_data.db</button>
        <button id="saveFileBtn" disabled style="opacity: 0.8">
          💾 2. 保存修改 → 覆盖原.db
        </button>
      </div>

      <!-- 状态行：仅显示当前文件/记录数 -->
      <div class="status">
        <span>📌</span>
        <span id="statusMessage">等待打开 .db 文件</span>
      </div>
      <div class="footnote" style="margin-top: 12px">
        * 修改单元格后直接点「保存」即覆盖原文件，无二次确认（精简原则）
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // ---------- 纯精简实现：读取本地.db，修改，保存回本地文件 ----------
        // 依赖: SQL.js + File System Access API (现代浏览器)
        // 完全针对 lottery_data.db，不添加任何多余功能

        let SQL = null; // sql.js 模块
        let db = null; // 当前数据库实例
        let currentFileHandle = null; // 当前打开的 lottery_data.db 文件句柄
        let tableName = ""; // 自动检测第一个表
        let columns = []; // 列名
        let primaryKeyColumn = null; // 用于更新时定位行（尽量用id列或第一列）

        // ----- 初始化sql.js -----
        const sqlPromise = window.initSqlJs({
          locateFile: (file) =>
            `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`,
        });

        sqlPromise
          .then((SQLModule) => {
            SQL = SQLModule;
            updateStatus("✅ SQL 引擎就绪，请选择 lottery_data.db");
          })
          .catch((err) => {
            updateStatus("❌ 加载SQL.js失败: " + err.message);
          });

        // ----- UI 元素 -----
        const openFileBtn = document.getElementById("openFileBtn");
        const saveFileBtn = document.getElementById("saveFileBtn");
        const statusEl = document.getElementById("statusMessage");
        const tableHeader = document.getElementById("table-header");
        const tableBody = document.getElementById("table-body");

        // ----- 更新状态 -----
        function updateStatus(msg) {
          statusEl.innerText = msg;
        }

        // ----- 清空表格显示 -----
        function clearTable() {
          tableHeader.innerHTML =
            '<tr><th colspan="10" style="text-align:center;">没有加载数据库</th></tr>';
          tableBody.innerHTML =
            '<tr><td colspan="10" style="text-align:center; padding:30px;">📭 请选择 lottery_data.db</td></tr>';
        }

        // ----- 打开文件按钮：读取本地 lottery_data.db -----
        openFileBtn.addEventListener("click", async function () {
          if (!SQL) {
            updateStatus("⏳ SQL正在初始化，稍后重试");
            return;
          }
          try {
            // 1. 选取文件（推荐命名为lottery_data.db，但用户可以选任何.db文件）
            [currentFileHandle] = await window.showOpenFilePicker({
              types: [
                {
                  description: "SQLite Database",
                  accept: {
                    "application/vnd.sqlite3": [".db", ".sqlite", ".sqlite3"],
                  },
                },
              ],
              multiple: false,
            });

            // 2. 读取文件内容
            const file = await currentFileHandle.getFile();
            const buffer = await file.arrayBuffer();
            const fileUint8 = new Uint8Array(buffer);

            // 3. 载入数据库
            db = new SQL.Database(fileUint8);
            updateStatus(
              `📂 已加载: ${file.name} (${(buffer.byteLength / 1024).toFixed(1)} KB)`,
            );

            // 4. 自动检测第一个用户表（忽略sqlite_sequence等系统表）
            const tables = db.exec(
              "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE 'android_%' ORDER BY name;",
            );
            if (!tables.length || !tables[0].values.length) {
              updateStatus("⚠️ 数据库中没有发现用户表");
              clearTable();
              return;
            }
            tableName = tables[0].values[0][0];

            // 5. 读取该表所有数据
            loadTableData();
            saveFileBtn.disabled = false;
            saveFileBtn.style.opacity = "1";
          } catch (err) {
            // 用户取消选择 或 其他错误
            if (err.name !== "AbortError") {
              updateStatus("❌ 打开失败: " + err.message);
              console.error(err);
            } else {
              updateStatus("已取消选择");
            }
            currentFileHandle = null;
            saveFileBtn.disabled = true;
          }
        });

        // ----- 读取当前表数据并渲染为可编辑表格 -----
        function loadTableData() {
          if (!db || !tableName) return;

          try {
            // 获取所有行
            const result = db.exec(`SELECT * FROM "${tableName}" LIMIT 500;`); // 避免超大表卡死
            if (!result.length) {
              // 表存在但无数据
              const colResult = db.exec(`PRAGMA table_info("${tableName}");`);
              columns = colResult[0].values.map((row) => row[1]); // 列名
              renderTable(columns, []);
              updateStatus(
                `表: ${tableName} (0 行记录) · 可直接添加？请使用原生sql工具——本工具仅修改已有行。`,
              );
              return;
            }

            const data = result[0];
            columns = data.columns;
            const rows = data.values;

            // 尝试找主键列 —— 简单起见，如果存在列名包含'id'、'ID'、'Id'，则作为更新键，否则默认用第一列
            const lowerCols = columns.map((c) => String(c).toLowerCase());
            const idIndex = lowerCols.findIndex(
              (c) => c === "id" || c === "_id" || c.endsWith("id"),
            );
            primaryKeyColumn = idIndex >= 0 ? columns[idIndex] : columns[0]; // 回退第一列

            renderTable(columns, rows);
            updateStatus(
              `📋 表: ${tableName} (${rows.length} 行) · 直接修改单元格，然后保存`,
            );
          } catch (e) {
            updateStatus("❌ 读取表数据失败: " + e.message);
          }
        }

        // ----- 渲染表格，所有数据单元格均添加contenteditable (主键列设为不可编辑以保持引用完整性) -----
        function renderTable(cols, rows) {
          // 生成表头
          let theadHtml = "<tr>";
          cols.forEach((col) => {
            theadHtml += `<th>${escapeHtml(col)}</th>`;
          });
          theadHtml += "</tr>";
          tableHeader.innerHTML = theadHtml;

          if (rows.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="${cols.length}" style="text-align:center; padding:30px; color:#6f8a98;">📭 该表暂无数据</td></tr>`;
            return;
          }

          // 生成可编辑行，主键列不可编辑（避免改id破坏引用）
          let tbodyHtml = "";
          for (let r of rows) {
            tbodyHtml += "<tr>";
            for (let i = 0; i < cols.length; i++) {
              const colName = cols[i];
              const value = r[i] !== null && r[i] !== undefined ? r[i] : "";
              // 判断是否主键列：不可编辑，且灰色显示；其他列可编辑
              const isPrimaryKey = colName === primaryKeyColumn;

              if (isPrimaryKey) {
                // 主键只读，加粗显示
                tbodyHtml += `<td style="font-weight:600; color:#1e4a5e;">${escapeHtml(value)}</td>`;
              } else {
                // 可编辑单元格: 带class, contenteditable
                tbodyHtml += `<td><span class="cell-editor" contenteditable="true" data-col-index="${i}" data-row-key="${r[0]}" data-col-name="${escapeHtml(colName)}">${escapeHtml(value)}</span></td>`;
              }
            }
            tbodyHtml += "</tr>";
          }
          tableBody.innerHTML = tbodyHtml;
        }

        // 简单的转义
        function escapeHtml(unsafe) {
          if (unsafe === undefined || unsafe === null) return "";
          return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        // ----- 保存修改：扫描表格内容，执行UPDATE，并写回原文件覆盖 -----
        saveFileBtn.addEventListener("click", async function () {
          if (!db || !tableName || !currentFileHandle) {
            updateStatus("❌ 没有已打开的数据库文件");
            return;
          }

          try {
            // 1. 收集所有修改——遍历所有可编辑span
            const editableSpans = document.querySelectorAll("span.cell-editor");
            if (!editableSpans.length) {
              updateStatus("ℹ️ 没有可修改的单元格");
              return;
            }

            // 开始事务
            db.run("BEGIN TRANSACTION;");

            // 按行聚合更新：一个行执行一次UPDATE
            const rowUpdates = new Map(); // key: rowId (主键值) -> {colName: newValue}

            for (let span of editableSpans) {
              const rowKey = span.dataset.rowKey; // 主键值（字符串形式）
              const colName = span.dataset.colName; // 列名
              const newValue = span.innerText.trim(); // 用户编辑后的文本

              if (!rowKey || !colName) continue;

              if (!rowUpdates.has(rowKey)) {
                rowUpdates.set(rowKey, {});
              }
              rowUpdates.get(rowKey)[colName] = newValue;
            }

            // 遍历每个更新的行，执行UPDATE
            for (let [rowId, updateMap] of rowUpdates.entries()) {
              // 构建 SET 部分：只更新修改了的列
              const setClauses = [];
              const params = [];
              for (let [col, val] of Object.entries(updateMap)) {
                setClauses.push(`"${col}" = ?`);
                params.push(val === "" ? null : val); // 保留null
              }
              if (setClauses.length === 0) continue;

              // 添加 WHERE 条件 (主键 = ?)
              const whereClause = `"${primaryKeyColumn}" = ?`;
              params.push(rowId);

              const sql = `UPDATE "${tableName}" SET ${setClauses.join(", ")} WHERE ${whereClause};`;
              db.run(sql, params);
            }

            db.run("COMMIT;");

            // 2. 将修改后的数据库导出，写回原文件覆盖
            const exportedData = db.export();

            // 3. 通过文件句柄创建可写流并覆盖
            const writable = await currentFileHandle.createWritable();
            await writable.write(exportedData);
            await writable.close();

            updateStatus("✅ 修改已保存 → 已直接覆盖原 lottery_data.db");

            // 4. 可选：重新读取显示（以确保显示最新）
            // 但为精简不自动重读，若用户修改了主键？但主键不可编辑，所以没问题。若想看到最新可点再次选取，这里保留内存状态一致
            // 为准确，重新从db里拉取数据渲染 (因为db已经更新)
            loadTableData();
          } catch (err) {
            db.run("ROLLBACK;");
            updateStatus("❌ 保存失败: " + err.message);
            console.error(err);
          }
        });

        // 初始状态：清空表格
        clearTable();
        updateStatus("等待操作 — 请点击【选取 lottery_data.db】");
      })();
    </script>

    <!-- 
    完全符合要求：
    - 自行读取本地 lottery_data.db 
    - 显示数据库内容，可修改单元格（主键不可改）
    - 保存修改并覆盖原文件
    - 极简，无多余功能
-->
  </body>
</html>
