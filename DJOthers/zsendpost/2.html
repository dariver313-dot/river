<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>香港六合彩预测中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #fef7f0;
        --bg-card: #ffffff;
        --bg-header: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        --accent-primary: #e74c3c;
        --accent-secondary: #c0392b;
        --accent-success: #27ae60;
        --accent-danger: #e74c3c;
        --accent-warning: #f39c12;
        --text-primary: #2c3e50;
        --text-secondary: #7f8c8d;
        --text-muted: #bdc3c7;
        --border-light: #ecf0f1;
        --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.06);
        --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans SC", sans-serif;
        background: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.6;
      }

      .bg-decoration {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
      }

      .bg-blob-1 {
        width: 500px;
        height: 500px;
        background: linear-gradient(135deg, #fadbd8 0%, #f5b7b1 100%);
        top: -150px;
        right: -150px;
      }

      .bg-blob-2 {
        width: 400px;
        height: 400px;
        background: linear-gradient(135deg, #fdebd0 0%, #f9e79f 100%);
        bottom: 15%;
        left: -100px;
      }

      .bg-blob-3 {
        width: 350px;
        height: 350px;
        background: linear-gradient(135deg, #d5f5e3 0%, #abebc6 100%);
        bottom: 25%;
        right: 3%;
      }

      .header {
        position: relative;
        z-index: 10;
        background: var(--bg-header);
        padding: 2.5rem 1.5rem;
        text-align: center;
        color: white;
        border-radius: 0 0 40px 40px;
        margin-bottom: 2rem;
      }

      .header-title {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
      }

      .header-subtitle {
        font-size: 0.875rem;
        opacity: 0.85;
        letter-spacing: 0.1em;
        margin-bottom: 1.5rem;
      }

      .period-pills {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .period-pill {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        padding: 0.625rem 1.25rem;
        border-radius: 100px;
        font-size: 0.875rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .period-pill span {
        opacity: 0.8;
        font-size: 0.75rem;
      }
      .period-pill strong {
        margin-left: 0.5rem;
        font-weight: 600;
      }

      .zodiac-select-wrapper {
        position: relative;
        display: inline-block;
      }

      .zodiac-select {
        padding: 0.5rem 2.25rem 0.5rem 1rem;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
        color: white;
        font-size: 0.875rem;
        cursor: pointer;
        font-family: inherit;
        font-weight: 500;
        appearance: none;
        outline: none;
        transition: all 0.2s ease;
      }

      .zodiac-select:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .zodiac-select:focus {
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.2);
      }

      .zodiac-select option {
        background: #c0392b;
        color: white;
        padding: 8px;
      }

      .select-arrow {
        position: absolute;
        right: 0.875rem;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        color: white;
        opacity: 0.7;
      }

      .result-section {
        position: relative;
        z-index: 10;
        max-width: 600px;
        margin: 0 auto 2rem;
        padding: 0 1rem;
      }

      .result-card {
        background: var(--bg-card);
        border-radius: 24px;
        padding: 1.5rem;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--border-light);
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-light);
      }

      .result-label {
        font-size: 0.8125rem;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .result-period {
        background: linear-gradient(
          135deg,
          var(--accent-primary) 0%,
          var(--accent-secondary) 100%
        );
        color: white;
        padding: 0.375rem 1rem;
        border-radius: 100px;
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .numbers-row {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .number-ball {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1rem;
        color: white;
        transition: transform 0.2s ease;
      }

      .number-ball:hover {
        transform: scale(1.1);
      }

      .number-ball.red {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
      }

      .number-ball.blue {
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
      }

      .number-ball.green {
        background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
        box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
      }

      .zodiacs-row {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .zodiac-tag {
        background: #fef5f3;
        color: var(--accent-primary);
        padding: 0.375rem 0.875rem;
        border-radius: 8px;
        font-size: 0.8125rem;
        font-weight: 500;
        border: 1px solid #fadbd8;
        transition: all 0.2s ease;
      }

      .zodiac-tag:hover {
        background: #fdeaea;
      }

      .predict-section {
        position: relative;
        z-index: 10;
        max-width: 600px;
        margin: 0 auto;
        padding: 0 1rem 7rem;
      }

      .section-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }

      .section-title::before {
        content: "";
        width: 4px;
        height: 20px;
        background: linear-gradient(
          180deg,
          var(--accent-primary) 0%,
          var(--accent-secondary) 100%
        );
        border-radius: 2px;
      }

      .predict-card {
        background: var(--bg-card);
        border-radius: 20px;
        margin-bottom: 1rem;
        box-shadow: var(--shadow-soft);
        border: 1px solid var(--border-light);
        overflow: hidden;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.4s ease;
      }

      .predict-card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .predict-card:hover {
        box-shadow: var(--shadow-card);
        transform: translateY(-2px);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
        background: linear-gradient(135deg, #fef9f7 0%, #fdf2ef 100%);
        border-bottom: 1px solid var(--border-light);
      }

      .author-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .author-avatar {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          var(--accent-primary) 0%,
          var(--accent-secondary) 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 0.75rem;
      }

      .author-name {
        font-weight: 600;
        font-size: 0.9375rem;
        color: var(--text-primary);
      }

      .verified-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        background: linear-gradient(135deg, #d5f5e3 0%, #abebc6 100%);
        color: #1e8449;
        padding: 0.25rem 0.625rem;
        border-radius: 6px;
        font-size: 0.6875rem;
        font-weight: 600;
      }

      .card-title {
        padding: 1rem 1.25rem 0.75rem;
        font-weight: 600;
        font-size: 0.9375rem;
        color: var(--accent-primary);
      }

      .card-content {
        padding: 0 1.25rem 1.25rem;
        font-size: 0.8125rem;
        line-height: 1.9;
        color: var(--text-muted);
        /* max-height: 320px; */
        overflow-y: auto;
      }

      .card-content::-webkit-scrollbar {
        width: 3px;
      }
      .card-content::-webkit-scrollbar-thumb {
        background: var(--accent-primary);
        border-radius: 3px;
      }

      .record-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px dashed #ecf0f1;
      }

      .record-item:last-child {
        border-bottom: none;
      }

      .record-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .record-period {
        font-size: 0.75rem;
        color: var(--text-muted);
        min-width: 50px;
      }

      .record-value {
        font-weight: 500;
        color: var(--text-primary);
        font-size: 0.875rem;
      }

      .record-status {
        font-size: 0.6875rem;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        font-weight: 600;
      }

      .status-hit {
        background: linear-gradient(135deg, #d5f5e3 0%, #abebc6 100%);
        color: #1e8449;
      }

      .status-miss {
        background: linear-gradient(135deg, #fadbd8 0%, #f5b7b1 100%);
        color: #c0392b;
      }

      .status-pending {
        background: linear-gradient(135deg, #fdebd0 0%, #f9e79f 100%);
        color: #b7950b;
      }

      .zodiac-badge {
        display: inline-block;
        background: linear-gradient(135deg, #fef5f3 0%, #fdeaea 100%);
        color: #c0392b;
        padding: 0.2rem 0.5rem;
        margin: 0.1rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid #fadbd8;
      }

      .number-badge {
        display: inline-block;
        background: linear-gradient(135deg, #fdebd0 0%, #f9e79f 100%);
        color: #b7950b;
        padding: 0.2rem 0.4rem;
        margin: 0.08rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        min-width: 26px;
        text-align: center;
      }

      .big-badge {
        background: linear-gradient(135deg, #fadbd8 0%, #f5b7b1 100%);
        color: #c0392b;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .small-badge {
        background: linear-gradient(135deg, #d6eaf8 0%, #aed6f1 100%);
        color: #2471a3;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .tail-badge {
        display: inline-block;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        color: #2e7d32;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .plain-text {
        font-size: 0.8125rem;
        color: var(--text-secondary);
        line-height: 1.8;
        white-space: pre-line;
      }

      .loader-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 200;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }

      .loader-overlay.done {
        opacity: 0;
        visibility: hidden;
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid var(--border-light);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader-text {
        margin-top: 1rem;
        color: var(--text-secondary);
        font-size: 0.875rem;
      }

      .action-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 1rem;
        display: flex;
        justify-content: center;
        gap: 0.6rem;
        z-index: 50;
        border-top: 1px solid var(--border-light);
        flex-wrap: wrap;
      }

      .action-btn {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.65rem 1rem;
        border: none;
        border-radius: 12px;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .action-btn:active {
        transform: scale(0.96);
      }
      .action-btn svg {
        width: 16px;
        height: 16px;
      }

      .refresh-btn {
        background: linear-gradient(
          135deg,
          var(--accent-primary) 0%,
          var(--accent-secondary) 100%
        );
        color: white;
        box-shadow: 0 4px 14px rgba(231, 76, 60, 0.3);
      }

      .export-btn {
        background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
        color: white;
        box-shadow: 0 4px 14px rgba(39, 174, 96, 0.3);
      }

      .export-txt-btn {
        background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
        color: white;
        box-shadow: 0 4px 14px rgba(243, 156, 18, 0.3);
      }

      .import-btn {
        background: linear-gradient(135deg, #3498db 0%, #2471a3 100%);
        color: white;
        box-shadow: 0 4px 14px rgba(52, 152, 219, 0.3);
      }

      .progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--border-light);
        z-index: 100;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--accent-primary),
          var(--accent-success)
        );
        width: 0%;
        transition: width 0.3s ease;
      }

      .file-input-hidden {
        display: none;
      }

      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: var(--accent-success);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 500;
        z-index: 300;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        background: var(--accent-danger);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-decoration">
      <div class="bg-blob bg-blob-1"></div>
      <div class="bg-blob bg-blob-2"></div>
      <div class="bg-blob bg-blob-3"></div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="loader-overlay" id="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">正在获取最新开奖数据...</div>
    </div>

    <div class="toast" id="toast"></div>

    <header class="header">
      <h1 class="header-title">香港六合彩预测中心</h1>
      <p class="header-subtitle">数据分析 走势预测</p>
      <div class="period-pills">
        <div class="zodiac-select-wrapper">
          <select class="zodiac-select" id="zodiacYearSelect">
            <option value="0">鼠年</option>
            <option value="1">牛年</option>
            <option value="2">虎年</option>
            <option value="3">兔年</option>
            <option value="4">龙年</option>
            <option value="5" selected>蛇年</option>
            <option value="6">马年</option>
            <option value="7">羊年</option>
            <option value="8">猴年</option>
            <option value="9">鸡年</option>
            <option value="10">狗年</option>
            <option value="11">猪年</option>
          </select>
          <svg
            class="select-arrow"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
        <div class="period-pill">
          <span>当前期号</span>
          <strong id="currentPeriod">--</strong>
        </div>
        <div class="period-pill">
          <span>预测期号</span>
          <strong id="nextPeriod">--</strong>
        </div>
      </div>
    </header>

    <section class="result-section">
      <div class="result-card">
        <div class="result-header">
          <span class="result-label">最新开奖结果</span>
          <span class="result-period" id="resultPeriod">--</span>
        </div>
        <div class="numbers-row" id="numbersRow"></div>
        <div class="zodiacs-row" id="zodiacsRow"></div>
      </div>
    </section>

    <section class="predict-section">
      <h2 class="section-title">
        第 <span id="predictPeriod">--</span> 期预测推荐
      </h2>
      <div id="cardsContainer"></div>
    </section>

    <div class="action-bar">
      <input
        type="file"
        id="fileInput"
        class="file-input-hidden"
        accept=".json"
      />
      <button class="action-btn import-btn" id="importBtn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
          />
        </svg>
        导入
      </button>
      <button class="action-btn export-btn" id="exportBtn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"
          />
        </svg>
        导出
      </button>
      <button class="action-btn export-txt-btn" id="exportTxtBtn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
        TXT
      </button>
      <button class="action-btn refresh-btn" id="refreshBtn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          />
        </svg>
        刷新
      </button>
    </div>

    <script>
      // ==================== 核心配置 ====================

      var ZODIACS = [
        "鼠",
        "牛",
        "虎",
        "兔",
        "龙",
        "蛇",
        "马",
        "羊",
        "猴",
        "鸡",
        "狗",
        "猪",
      ];

      // var API_URL = "https://ty202601.com/lotteryV3/lotOp.do";
      var MAX_RECORDS = 9;

      var RED_NUMBERS = [
        1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46,
      ];
      var BLUE_NUMBERS = [
        3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48,

            contentHtml =
              '<div class="plain-text">四肖中特</div>' +
              '<div style="margin:0.5rem 0">' +
              zodiacs
                .map(function (z) {
                  return '<span class="zodiac-badge">' + z + "</span>";
                })
                .join(" ") +
              "</div>" +
              '<div class="plain-text">跟上回血</div>';
            textContent = "四肖中特\n" + zodiacs.join(" ") + "\n跟上回血";
            break;
          }

          case "zodiac_single_text": {
            var zodiac = randomZodiac();
            var text = template.content.replace(/{zodiac}/g, zodiac);
            contentHtml = '<div class="plain-text">' + text + "</div>";
            textContent = text;
            break;
          }

          case "big_small": {
            var records = template.records;
            contentHtml =
              "七期必中特码" +
              records
                .map(function (r) {
                  var badgeClass =
                    r.value === "大" ? "big-badge" : "small-badge";
                  var statusText =
                    r.hit === null ? "必中" : r.hit ? "中中中" : "不中";
                  return (
                    '<div class="record-item">' +
                    '<div class="record-left">' +
                    '<span class="record-period">' +
                    r.period +
                    "期特码买</span>" +
                    '<span class="' +
                    badgeClass +
                    '">' +
                    r.value +
                    "</span>" +
                    "</div>" +
                    '<span class="record-status ' +
                    getStatusClass(r.hit) +
                    '">' +
                    statusText +
                    "</span>" +
                    "</div>"
                  );
                })
                .join("");
            textContent =
              "七期必中特码\n" +
              records
                .map(function (r) {
                  var statusText =
                    r.hit === null ? "必中" : r.hit ? "中中中" : "不中";
                  return r.period + "期特码买" + r.value + "  " + statusText;
                })
                .join("\n");
            break;
          }

          case "zodiac_six": {
            var records = template.records;
            contentHtml =
              "六肖中特" +
              records
                .map(function (r) {
                  var statusText =
                    r.hit === null ? "必中" : r.hit ? "中" : "挂";
                  return (
                    '<div class="record-item">' +
                    '<div class="record-left">' +
                    '<span class="record-period">' +
                    r.period +
                    "期:六肖:</span>" +
                    "<span>" +
                    r.zodiacs
                      .map(function (z) {
                        return '<span class="zodiac-badge">' + z + "</span>";
                      })
                      .join("") +
                    "</span>" +
                    "</div>" +
                    '<span class="record-status ' +
                    getStatusClass(r.hit) +
                    '">' +
                    statusText +
                    "</span>" +
                    "</div>"
                  );
                })
                .join("");
            textContent =
              "六肖中特\n" +
              records
                .map(function (r) {
                  var statusText =
                    r.hit === null ? "必中" : r.hit ? "中" : "挂";
                  return (
                    r.period +
                    "期:六肖: " +
                    r.zodiacs.join(" ") +
                    " " +
                    statusText
                  );
                })
                .join("\n");
            break;
          }

          case "zodiac_bet": {
            var zodiac = randomZodiac();
            var text = template.content.replace("{zodiac}", zodiac);
            contentHtml = '<div class="plain-text">' + text + "</div>";
            textContent = text;
            break;
          }

          case "zodiac_triple": {
            var zodiacs = randomZodiacs(3);
            contentHtml =
              '<div class="plain-text">三连肖</div>' +
              '<div style="margin:0.5rem 0">' +
              zodiacs
                .map(function (z) {
                  return '<span class="zodiac-badge">' + z + "</span>";
                })
                .join(" ") +
              "</div>" +
              '<div class="plain-text">复式三连肖</div>';
            textContent = "三连肖\n" + zodiacs.join(" ") + "\n复式三连肖";
            break;
          }

          // 新增：tail_single 类型，显示历史记录
          case "tail_single": {
            var records = template.records;
            // 找到最后一条（预测期）和倒数第二条（上期）
            var lastRecord = records[records.length - 1];
            var prevRecord =
              records.length > 1 ? records[records.length - 2] : null;

            // 显示：上期推荐X尾没中，今天推荐Y尾，连中开始
            var prevTail = prevRecord ? prevRecord.tail : "?";
            var prevHit = prevRecord ? prevRecord.hit : false;
            var prevStatus = prevHit ? "中" : "没中";
            var newTail = lastRecord.tail;

            contentHtml =
              '<div class="record-item">' +
              '<div class="record-left">' +
              '<span class="record-period">上期推荐</span>' +
              '<span class="tail-badge">' +
              prevTail +
              "尾</span>" +
              "</div>" +
              '<span class="record-status ' +
              getStatusClass(prevHit) +
              '">' +
              prevStatus +
              "</span>" +
              "</div>" +
              '<div class="record-item">' +
              '<div class="record-left">' +
              '<span class="record-period">今天推荐</span>' +
              '<span class="tail-badge">' +
              newTail +
              "尾</span>" +
              "</div>" +
              '<span class="record-status ' +
              getStatusClass(null) +
              '">必中</span>' +
              "</div>" +
              '<div class="plain-text" style="margin-top:0.5rem">连中开始</div>';

            textContent =
              "上期推荐" +
              prevTail +
              "尾" +
              prevStatus +
              "，今天推荐" +
              newTail +
              "尾，连中开始";
            break;
          }

          case "special_numbers": {
            var nums = randomNumbers(24, false);
            contentHtml =
              '<div class="plain-text">精准24码</div>' +
              '<div style="margin-top:0.5rem">' +
              nums
                .map(function (n) {
                  return '<span class="number-badge">' + n + "</span>";
                })
                .join(" ") +
              "</div>";
            textContent = "精准24码\n" + nums.join(" ");
            break;
          }

          case "exclude_numbers": {
            var nums = randomNumbers(5, true);
            var text = template.content
              .replace("{period}", shortPeriod)
              .replace("{numbers}", nums.join(", "));
            contentHtml = '<div class="plain-text">' + text + "</div>";
            textContent = text;
            break;
          }

          case "poem": {
            var poems = template.poems;
            var poem = poems[randomInt(0, poems.length - 1)];
            contentHtml = '<div class="plain-text">' + poem + "</div>";
            textContent = poem;
            break;
          }
        }

        return {
          title: title,
          contentHtml: contentHtml,
          textContent: textContent,
        };
      }

      // ==================== 卡片渲染 ====================

      function renderCards(nextPeriod) {
        var container = document.getElementById("cardsContainer");
        container.innerHTML = "";
        generatedData = [];

        templates.forEach(function (template, index) {
          var prediction = generatePrediction(template, nextPeriod);

          generatedData.push({
            account: template.account,
            title: prediction.title,
            content: prediction.textContent,
          });

          var card = document.createElement("div");
          card.className = "predict-card";

          card.innerHTML =
            '<div class="card-header">' +
            '<div class="author-info">' +
            '<div class="author-avatar">' +
            template.account.slice(-4) +
            "</div>" +
            '<span class="author-name">' +
            template.account +
            "</span>" +
            "</div>" +
            '<span class="verified-badge">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
            '<path d="M20 6L9 17l-5-5"/>' +
            "</svg>" +
            "已验证" +
            "</span>" +
            "</div>" +
            '<div class="card-title">' +
            prediction.title +
            "</div>" +
            '<div class="card-content">' +
            prediction.contentHtml +
            "</div>";

          container.appendChild(card);

          setTimeout(function () {
            card.classList.add("visible");
          }, index * 50);
        });
      }

      // ==================== 导入导出 ====================

      function exportData() {
        var dataToSave = {
          version: 1,
          type: "hk",
          savedAt: new Date().toISOString(),
          currentZodiacIndex: currentZodiacIndex,
          lastOpenedPeriodShort: lastOpenedPeriodShort,
          templates: templates,
        };

        var jsonStr = JSON.stringify(dataToSave, null, 2);
        var blob = new Blob([jsonStr], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "hk_predict_data.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast("数据已导出");
      }

      function importData(file) {
        var reader = new FileReader();
        reader.onload = function (e) {
          try {
            var data = JSON.parse(e.target.result);
            if (data.templates && Array.isArray(data.templates)) {
              templates = data.templates;
              if (data.currentZodiacIndex !== undefined) {
                currentZodiacIndex = data.currentZodiacIndex;
                document.getElementById("zodiacYearSelect").value =
                  currentZodiacIndex;
              }
              if (data.lastOpenedPeriodShort) {
                lastOpenedPeriodShort = data.lastOpenedPeriodShort;
              }
              showToast("数据导入成功");
            } else {
              showToast("文件格式错误", true);
            }
          } catch (err) {
            showToast("文件解析失败", true);
          }
        };
        reader.readAsText(file);
      }

      function exportTxtFile() {
        if (generatedData.length === 0) {
          showToast("请先生成预测数据", true);
          return;
        }

        var nextPeriod = (parseInt(currentData.expect) + 1).toString();
        var shortPeriod = getShortPeriod(nextPeriod);

        var txtContent = generatedData
          .map(function (item) {
            return (
              "账号   " +
              item.account +
              "\n" +
              "标题   " +
              item.title +
              "\n" +
              "内容   \n" +
              item.content +
              "\n"
            );
          })
          .join("\n");

        var blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "香港" + shortPeriod + "期预测.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast("已导出 香港" + shortPeriod + "期预测.txt");
      }

      // ==================== 初始化 ====================

      async function init() {
        var loader = document.getElementById("loader");
        var progressFill = document.getElementById("progressFill");

        try {
          progressFill.style.width = "10%";

          if (!templates) {
            templates = JSON.parse(JSON.stringify(defaultTemplates));
          }

          var data = await fetchLotteryData();
          currentData = data;
          progressFill.style.width = "80%";

          renderResult(data);

          var newPeriodShort = getShortPeriod(
            (parseInt(data.expect) + 1).toString(),
          );

          templates.forEach(function (template) {
            if (template.records) {
              processTemplate(template, newPeriodShort);
            }
          });

          var nextPeriod = (parseInt(data.expect) + 1).toString();
          renderCards(nextPeriod);

          progressFill.style.width = "100%";

          setTimeout(function () {
            loader.classList.add("done");
          }, 300);
        } catch (error) {
          console.error("初始化失败:", error);
          loader.classList.add("done");
        }
      }

      // ==================== 事件绑定 ====================

      document
        .getElementById("zodiacYearSelect")
        .addEventListener("change", function () {
          currentZodiacIndex = parseInt(this.value);

          if (currentData) {
            renderResult(currentData);

            templates.forEach(function (template) {
              recheckRecordsByPeriod(template);
            });

            var nextPeriod = (parseInt(currentData.expect) + 1).toString();
            renderCards(nextPeriod);
          }
        });

      document
        .getElementById("refreshBtn")
        .addEventListener("click", async function () {
          var cards = document.querySelectorAll(".predict-card");
          cards.forEach(function (card) {
            card.classList.remove("visible");
          });

          setTimeout(async function () {
            var data = await fetchLotteryData();
            currentData = data;
            renderResult(data);

            var newPeriodShort = getShortPeriod(
              (parseInt(data.expect) + 1).toString(),
            );

            templates.forEach(function (template) {
              if (template.records) {
                processTemplate(template, newPeriodShort);
              }
            });

            var nextPeriod = (parseInt(data.expect) + 1).toString();
            renderCards(nextPeriod);
          }, 400);
        });

      document
        .getElementById("exportBtn")
        .addEventListener("click", exportData);
      document
        .getElementById("exportTxtBtn")
        .addEventListener("click", exportTxtFile);

      document
        .getElementById("importBtn")
        .addEventListener("click", function () {
          document.getElementById("fileInput").click();
        });

      document
        .getElementById("fileInput")
        .addEventListener("change", function (e) {
          if (e.target.files && e.target.files[0]) {
            importData(e.target.files[0]);
            e.target.value = "";
          }
        });

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
