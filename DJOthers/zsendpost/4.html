<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serene Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --fg: #334155;
      --fg-muted: #64748b;
      --accent: #38bdf8;
      --accent-secondary: #a78bfa;
      --accent-warm: #f472b6;
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.5);
      --input-bg: rgba(255, 255, 255, 0.45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Video Background Layer */
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.85) contrast(1.1);
    }

    /* Frosted Glass Overlay */
    .frosted-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(15px) saturate(180%);
      -webkit-backdrop-filter: blur(15px) saturate(180%);
      z-index: 1;
      pointer-events: none;
    }

    /* Gradient Overlay */
    .gradient-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0%, rgba(15, 23, 42, 0.2) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Main Container */
    .main-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Login Card */
    .login-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 48px 44px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      border: 1px solid var(--card-border);
      box-shadow: 
        0 30px 100px -20px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
      animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(50px) scale(0.95);
      overflow: hidden;
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, transparent 100%);
      border-radius: 32px 32px 100px 100px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-circle {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-secondary);
      animation: logoSpin 4s linear infinite;
    }

    .logo-circle:nth-child(2) {
      inset: 4px;
      border-top-color: var(--accent-warm);
      border-left-color: var(--accent-warm);
      animation-duration: 3s;
      animation-direction: reverse;
    }

    @keyframes logoSpin {
      to { transform: rotate(360deg); }
    }

    .logo-inner {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4);
    }

    .logo-inner svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--fg-muted);
      font-weight: 400;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }

    .form-group:nth-child(1) { animation-delay: 0.2s; }
    .form-group:nth-child(2) { animation-delay: 0.3s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 16px 20px 16px 50px;
      background: var(--input-bg);
      border: 2px solid transparent;
      border-radius: 16px;
      font-family: inherit;
      font-size: 15px;
      color: var(--fg);
      font-weight: 500;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .form-input:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .form-input:focus {
      background: rgba(255, 255, 255, 0.8);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--fg-muted);
      transition: color 0.3s ease;
      pointer-events: none;
    }

    .form-input:focus ~ .input-icon {
      color: var(--accent);
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .password-toggle:hover {
      color: var(--fg);
      background: rgba(0,0,0,0.05);
    }

    /* Options */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.4s forwards;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-input { display: none; }

    .checkbox-visual {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      position: relative;
      transition: all 0.2s ease;
    }

    .checkbox-input:checked + .checkbox-visual {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-visual svg {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 12px;
      height: 12px;
      stroke: white;
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transform: scale(0);
      transition: all 0.2s ease;
    }

    .checkbox-input:checked + .checkbox-visual svg {
      opacity: 1;
      transform: scale(1);
    }

    .checkbox-label {
      font-size: 13px;
      color: var(--fg-muted);
      font-weight: 500;
    }

    .forgot-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: var(--accent-secondary);
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      border: none;
      border-radius: 16px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.5s forwards;
      box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.5);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px -10px rgba(167, 139, 250, 0.6);
    }

    .submit-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-text {
      position: relative;
      z-index: 1;
    }

    .btn-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: btnShine 3s ease-in-out infinite;
    }

    @keyframes btnShine {
      0% { left: -100%; }
      50%, 100% { left: 100%; }
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.6s forwards;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.3), transparent);
    }

    .divider-text {
      font-size: 11px;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Social Buttons */
    .social-row {
      display: flex;
      gap: 12px;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.7s forwards;
    }

    .social-btn {
      flex: 1;
      padding: 14px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .social-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Footer */
    .footer-text {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: var(--fg-muted);
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.8s forwards;
    }

    .footer-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 36px 28px;
        border-radius: 24px;
      }
      .social-row {
        flex-direction: column;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Video Background -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
  </video>

  <!-- Frosted Glass Overlay -->
  <div class="frosted-overlay"></div>
  <div class="gradient-overlay"></div>

  <!-- Main Content -->
  <div class="main-container">
    <div class="login-card">
      <div class="card-glow"></div>
      
      <!-- Header -->
      <div class="header">
        <div class="logo-mark">
          <div class="logo-circle"></div>
          <div class="logo-circle"></div>
          <div class="logo-inner">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
        </div>
        <h1 class="title">Welcome Back</h1>
        <p class="subtitle">Sign in to continue your journey</p>
      </div>

      <!-- Form -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <input type="email" class="form-input" placeholder="you@example.com" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M22 6l-10 7L2 6"/>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="options-row">
          <label class="checkbox-wrapper">
            <input type="checkbox" class="checkbox-input">
            <span class="checkbox-visual">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            <span class="checkbox-label">Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">
          <span class="btn-shine"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or continue with</span>
        <div class="divider-line"></div>
      </div>

      <div class="social-row">
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" fill="#EA4335">
            <path d="M5.27 9.76A7.08 7.08 0 0 1 12 5.25c1.76 0 3.3.6 4.53 1.6l3.39-3.39A11.95 11.95 0 0 0 12 0 12 12 0 0 0 1.04 6.86l4.23 2.9z"/>
            <path d="M16.04 18.01A7.4 7.4 0 0 1 12 19.25a7.08 7.08 0 0 1-6.73-4.51l-4.23 2.9A12 12 0 0 0 12 24c3.19 0 6.08-1.24 8.26-3.26l-4.22-2.73z"/>
            <path d="M20.26 20.74A11.87 11.87 0 0 0 24 12c0-.81-.08-1.59-.23-2.34H12v4.7h6.81a5.87 5.87 0 0 1-2.55 3.85l4 2.53z"/>
          </svg>
          Google
        </button>
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" fill="#000">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.43 9.8 8.21 11.39.6.11.79-.26.79-.58v-2.23c-3.34.73-4.03-1.42-4.03-1.42-.55-1.38-1.34-1.75-1.34-1.75-1.09-.75.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.25 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.19.7.8.58A12 12 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <div class="footer-text">
        Don't have an account?<a href="#">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = form.querySelector('.submit-btn');

    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      
      if (type === 'text') {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      submitBtn.innerHTML = `
        <span class="btn-shine"></span>
        <span class="btn-text">Signing in...</span>
      `;
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      setTimeout(() => {
        submitBtn.innerHTML = `
          <span class="btn-shine"></span>
          <span class="btn-text">Success!</span>
        `;
        submitBtn.style.background = 'linear-gradient(135deg, #10b981, #2dd4bf)';
        
        setTimeout(() => {
          submitBtn.innerHTML = `
            <span class="btn-shine"></span>
            <span class="btn-text">Sign In</span>
          `;
          submitBtn.style.background = '';
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          form.reset();
        }, 2000);
      }, 1500);
    });

    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.closest('.input-wrapper').style.transform = 'scale(1.01)';
      });
      input.addEventListener('blur', function() {
        this.closest('.input-wrapper').style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
