services:
  djmima:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: djmima
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3101:3001"
    volumes:
      - djmima_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  djmima_data:
    name: djmima_data
