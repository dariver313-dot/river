# 全局设置
app:
  name: "做账"
  version: "3.2"
  window_width: 1200
  window_height: 680

# 数据文件默认路径
paths:
  excel_dir: "excel"          # 原始Excel数据目录
  template_dir: "excel"       # 模版文件目录（与数据同目录）
  output_dir: "data/output"   # 输出目录

# 输出文件命名: 2026天游6.3.xlsx
output:
  filename_pattern: "2026{platform_name}{date_short}.xlsx"

# 日志设置
logging:
  level: "INFO"
  dir: "logs"
  filename: "reconciliation.log"
  max_bytes: 10485760
  backup_count: 30
  format: "%(asctime)s | %(levelname)-8s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
