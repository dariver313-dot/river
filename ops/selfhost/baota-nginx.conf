# 宝塔站点配置模板：将域名和证书路径交给宝塔界面管理；以下内容用于站点的反向代理配置。
# Docker 只监听 127.0.0.1:3101，绝不在公网暴露 Node 端口。

client_max_body_size 64k;
server_tokens off;

location ~* ^/(?:\.env|\.git|\.svn|\.hg|node_modules|package(?:-lock)?\.json) {
    return 404;
}

location = /api/internal/backup/snapshot {
    return 404;
}

# 初始化页含有一次性验证器密钥，不能被浏览器、代理或搜索引擎缓存或索引。
location = /setup {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store, max-age=0, private" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
}
